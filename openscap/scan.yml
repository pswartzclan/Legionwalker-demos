---
- name: OpenSCAP compliance scan
  hosts: all
  become: true
  gather_facts: false
  vars:
    scan_datastream: /usr/share/xml/scap/ssg/content/ssg-rlch9-ds.xml
    scan_profile: xccdf_org.ssgproject.content_profile_stig
    scan_dir: /var/tmp/openscap
    results_file: "{{ scan_dir }}/results-{{ inventory_hostname }}.xml"
    report_file: "{{ scan_dir }}/report-{{ inventory_hostname }}.html"
  tasks:
    - name: Create the results directory
      ansible.builtin.file:
        path: "{{ scan_dir }}"
        state: directory
        mode: "0755"

    - name: Run the OpenSCAP scan
      ansible.builtin.command:
        argv:
          - oscap
          - xccdf
          - eval
          - --profile
          - "{{ scan_profile }}"
          - --results
          - "{{ results_file }}"
          - --report
          - "{{ report_file }}"
          - "{{ scan_datastream }}"
      register: scan
      failed_when: scan.rc not in [0, 2]
      changed_when: true

    - name: Make the report readable
      ansible.builtin.file:
        path: "{{ report_file }}"
        mode: "0644"

    - name: Count passed rules
      ansible.builtin.shell: grep -c '<result>pass</result>' {{ results_file }} || true
      register: pass_count
      changed_when: false

    - name: Count failed rules
      ansible.builtin.shell: grep -c '<result>fail</result>' {{ results_file }} || true
      register: fail_count
      changed_when: false

    - name: Show the summary
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ pass_count.stdout }} passed, {{ fail_count.stdout }} failed ({{ scan_profile | regex_replace('^.*profile_', '') }})"
