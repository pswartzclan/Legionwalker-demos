---
- name: Remove old kernels
  hosts: all
  become: true
  tasks:
    - name: Find old kernel packages (the newest set is kept)
      ansible.builtin.command: dnf repoquery --installonly --latest-limit=-1 -q
      register: old_kernels
      changed_when: false

    - name: Remove them
      ansible.builtin.dnf:
        name: "{{ old_kernels.stdout_lines }}"
        state: absent
      when: old_kernels.stdout_lines | length > 0

    - name: Upgrade kernel-tools and kernel-tools-libs (not installonly, so they're missed by the step above and by the main patch task's kernel* exclude)
      ansible.builtin.dnf:
        name:
          - kernel-tools
          - kernel-tools-libs
        state: latest
      register: tools_upgrade

    - name: Summary
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ old_kernels.stdout_lines | length }} old kernel packages
          {{ 'removed' if old_kernels.stdout_lines | length > 0 else 'found, nothing to do' }}.
          kernel-tools/kernel-tools-libs {{ 'upgraded' if tools_upgrade.changed else 'already current' }}.
